[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tablewatch"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "pydantic>=2.0",
  "confluent-kafka[avro]>=2.13.2",
  "pydantic-avro>=0.7.0",
  "psycopg2-binary>=2.9.11",
  "fastavro>=1.9",
  "apache-flink==1.18.1",
  "apache-flink-libraries==1.18.1",
  "python-dotenv>=1.2.2",
  "pydantic-settings>=2.13.1",
  "faker>=40.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
