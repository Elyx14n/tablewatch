services:
  kafka:
    image: confluentinc/cp-kafka:7.8.6
    container_name: tablewatch-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: 'A72492A0-4F8C-9F1E-A096-D843AE6642D5'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824 # 1GB segments
      KAFKA_LOG_RETENTION_BYTES: 10737418240 # 10GB max per broker
    volumes:
      - kafka_kraft:/var/lib/kafka/data
    networks:
      - tablewatch-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-setup:
    image: confluentinc/cp-kafka:7.8.6
    container_name: tablewatch-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tablewatch-network
    entrypoint: [ "bash", "-c", "
      echo 'Kafka is healthy, creating topic...' &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic blackjack --partitions 80 --replication-factor 1 &&
      echo 'Topic created successfully!'" ]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.6
    container_name: tablewatch-schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tablewatch-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tablewatch-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tablewatch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_SERDES_0_NAME: Avro
      KAFKA_CLUSTERS_0_SERDES_0_CLASSNAME: io.provectus.kafka.ui.serde.api.SchemaRegistrySerde
      KAFKA_CLUSTERS_0_SERDES_0_PROPERTIES_URL: http://schema-registry:8081
    depends_on:
      - kafka
      - schema-registry
    networks:
      - tablewatch-network

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: tablewatch-db
    environment:
      - POSTGRES_DB=tablewatch
      - POSTGRES_USER=tablewatch
      - POSTGRES_PASSWORD=tablewatch
      - TS_TUNE_LIBRARIES=timescaledb,pg_cron
      - TS_TUNE_POSTGRES_CONF=cron.database_name='tablewatch'
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d tablewatch -U tablewatch"]
      interval: 5s
      retries: 10
    networks:
      - tablewatch-network

  seed:
    build: .
    container_name: tablewatch-seed
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - tablewatch-network
    command: python -m src.db.seed
    restart: no

  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: tablewatch-flink-jobmanager
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    networks:
      - tablewatch-network

  flink-taskmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: tablewatch-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: 5
    networks:
      - tablewatch-network

  flink-job-bet-spread:
    build: .
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: bash -c "sleep 15 && python -m src.pipelines.bet_spread"
    restart: unless-stopped
    networks:
      - tablewatch-network
    env_file:
      - .env
    volumes:
      - ./src:/app/src

  flink-job-win-rate:
    build: .
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: bash -c "sleep 15 && python -m src.pipelines.win_rate"
    restart: unless-stopped
    networks:
      - tablewatch-network
    env_file:
      - .env
    volumes:
      - ./src:/app/src

  flink-job-bet-rate-of-change:
    build: .
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: bash -c "sleep 15 && python -m src.pipelines.bet_rate_of_change"
    restart: unless-stopped
    networks:
      - tablewatch-network
    env_file:
      - .env
    volumes:
      - ./src:/app/src

  flink-job-wonging:
    build: .
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: bash -c "sleep 15 && python -m src.pipelines.wonging"
    restart: unless-stopped
    networks:
      - tablewatch-network
    env_file:
      - .env
    volumes:
      - ./src:/app/src

  flink-job-card-counting:
    build: .
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: bash -c "sleep 15 && python -m src.pipelines.card_counting"
    restart: unless-stopped
    networks:
      - tablewatch-network
    env_file:
      - .env
    volumes:
      - ./src:/app/src

  team-detection-scheduler:
    build: .
    container_name: tablewatch-team-detection-scheduler
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: bash -c "sleep 20 && python -m src.pipelines.team_detection"
    restart: unless-stopped
    networks:
      - tablewatch-network
    env_file:
      - .env
    volumes:
      - ./src:/app/src

  main:
    build: .
    container_name: tablewatch-game-simulator
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    env_file:
      - .env
    networks:
      - tablewatch-network
    command: >
      bash -c "
        echo 'Kafka, Schema Registry, and topic are ready!' &&
        echo 'Waiting 5 seconds for schema registry to fully initialize...' &&
        sleep 5 &&
        echo 'Starting blackjack game simulator...' &&
        python -m src.main
      "
    restart: unless-stopped
    volumes:
      - ./src:/app/src

  grafana:
    pull_policy: always
    image: grafana/grafana
    container_name: ${GRAFANA_CONTAINER_NAME}
    env_file: .env
    ports:
      - ${GRAFANA_PORT}:${GRAFANA_PORT}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - tablewatch-network
    volumes:
      - grafana_data:/var/lib/grafana
      - ./src/db/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml


volumes:
  kafka_kraft:
  timescale_data:
  grafana_data:

networks:
  tablewatch-network:
    driver: bridge