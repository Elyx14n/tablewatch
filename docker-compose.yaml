services:
  kafka:
    image: confluentinc/cp-kafka:7.8.6
    container_name: tablewatch-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: 'A72492A0-4F8C-9F1E-A096-D843AE6642D5'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824 # 1GB segments
      KAFKA_LOG_RETENTION_BYTES: 10737418240 # 10GB max per broker
    volumes:
      - kafka_kraft:/var/lib/kafka/data
    networks:
      - tablewatch-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-setup:
    image: confluentinc/cp-kafka:7.8.6
    container_name: tablewatch-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tablewatch-network
    entrypoint: [ "bash", "-c", "
      echo 'Creating topics...' &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic blackjack --partitions 8 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic bet_events --partitions 8 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic outcome_events --partitions 8 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic seat_events --partitions 8 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic _schemas --partitions 1 --replication-factor 1 --config cleanup.policy=compact &&
      echo 'Waiting for _schemas leader election...' &&
      until kafka-topics --bootstrap-server kafka:29092 --describe --topic _schemas 2>/dev/null | grep -q 'Leader:'; do sleep 1; done &&
      echo 'Leader elected, waiting for metadata propagation...' &&
      sleep 10 &&
      echo 'All topics ready!'" ]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.6
    container_name: tablewatch-schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - tablewatch-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tablewatch-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tablewatch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_SERDES_0_NAME: Avro
      KAFKA_CLUSTERS_0_SERDES_0_CLASSNAME: io.provectus.kafka.ui.serde.api.SchemaRegistrySerde
      KAFKA_CLUSTERS_0_SERDES_0_PROPERTIES_URL: http://schema-registry:8081
    depends_on:
      - kafka
      - schema-registry
    networks:
      - tablewatch-network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: tablewatch-db
    ports:
    - "5432:5432"
    environment:
      - POSTGRES_DB=tablewatch
      - POSTGRES_USER=tablewatch
      - POSTGRES_PASSWORD=tablewatch
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "psql -U tablewatch -d tablewatch -c 'SELECT 1' -q --no-align --tuples-only 2>/dev/null | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      - tablewatch-network

  seed:
    build: .
    image: tablewatch-app:latest
    container_name: tablewatch-seed
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - tablewatch-network
    command: python -m src.db.seed
    restart: no

  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    image: tablewatch-flink:latest
    pull_policy: never
    container_name: tablewatch-flink-jobmanager
    hostname: flink-jobmanager
    env_file: .env
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    volumes:
      - ./src:/opt/src
    networks:
      - tablewatch-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/jobs"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

  flink-taskmanager:
    image: tablewatch-flink:latest
    pull_policy: never
    container_name: tablewatch-flink-taskmanager
    env_file: .env
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager --taskmanager.registration.timeout 5 min
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 30
        taskmanager.memory.process.size: 4096m
        parallelism.default: 4
    volumes:
      - ./src:/opt/src
    networks:
      - tablewatch-network

  team-detection:
    image: tablewatch-flink:latest
    pull_policy: never
    container_name: tablewatch-team-detection
    env_file: .env
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: >
      bash -c "
        while true; do
          sleep 1800 &&
          flink run --pyModule pipelines.recursive_network_expansion --pyFiles /opt/src &&
          flink run --pyModule pipelines.entity_resolution_clustering --pyFiles /opt/src;
        done
      "
    volumes:
      - ./src:/opt/src
    networks:
      - tablewatch-network
    restart: unless-stopped

  flink-job-submitter:
    image: tablewatch-flink:latest
    pull_policy: never
    container_name: tablewatch-flink-job-submitter
    env_file: .env
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Cancelling any existing running jobs...' &&
        flink list -r 2>/dev/null | awk '/RUNNING/{print \$4}' | xargs -r -I{} flink cancel {} ;
        flink run --pyModule pipelines.bet_spread --pyFiles /opt/src -d;
        flink run --pyModule pipelines.win_rate --pyFiles /opt/src -d;
        flink run --pyModule pipelines.bet_rate_of_change --pyFiles /opt/src -d;
        flink run --pyModule pipelines.wonging --pyFiles /opt/src -d;
        flink run --pyModule pipelines.card_counting --pyFiles /opt/src -d;
        flink run --pyModule pipelines.betting_volatility_correlation --pyFiles /opt/src -d
      "
    volumes:
      - ./src:/opt/src
    networks:
      - tablewatch-network
    restart: on-failure

  main:
    image: tablewatch-app:latest
    container_name: tablewatch-game-simulator
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    env_file:
      - .env
    networks:
      - tablewatch-network
    command: >
      bash -c "
        echo 'Kafka, Schema Registry, and topic are ready!' &&
        echo 'Waiting 5 seconds for schema registry to fully initialize...' &&
        sleep 5 &&
        echo 'Starting blackjack game simulator...' &&
        python -m src.main
      "
    restart: unless-stopped
    volumes:
      - ./src:/app/src

  grafana:
    image: grafana/grafana
    container_name: ${GRAFANA_CONTAINER_NAME}
    env_file: .env
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - tablewatch-network
    volumes:
      - grafana_data:/var/lib/grafana
      - ./src/db/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./src/db/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    container_name: tablewatch-caddy
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - grafana
    networks:
      - tablewatch-network
    restart: unless-stopped


volumes:
  kafka_kraft:
  timescale_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  tablewatch-network:
    driver: bridge