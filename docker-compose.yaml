services:
  kafka:
    image: confluentinc/cp-kafka:7.8.6
    container_name: tablewatch-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: 'A72492A0-4F8C-9F1E-A096-D843AE6642D5'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824 # 1GB segments
      KAFKA_LOG_RETENTION_BYTES: 10737418240 # 10GB max per broker
    volumes:
      - kafka_kraft:/var/lib/kafka/data
    networks:
      - tablewatch-network

  kafka-setup:
    image: confluentinc/cp-kafka:7.8.6
    container_name: tablewatch-kafka-setup
    depends_on:
      - kafka
    networks:
      - tablewatch-network
    entrypoint: [ "bash", "-c", "
      echo 'Waiting for Kafka...' &&
      cub kafka-ready -b kafka:29092 1 30 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic blackjack --partitions 80 --replication-factor 1 &&
      echo 'Topic created successfully!'" ]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.6
    container_name: tablewatch-schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      - kafka
    networks:
      - tablewatch-network

  kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: tablewatch-kafka-ui
      ports:
        - "8080:8080"
      environment:
        KAFKA_CLUSTERS_0_NAME: tablewatch
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
        KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
        KAFKA_CLUSTERS_0_SERDES_0_NAME: Avro
        KAFKA_CLUSTERS_0_SERDES_0_CLASSNAME: io.provectus.kafka.ui.serde.api.SchemaRegistrySerde
        KAFKA_CLUSTERS_0_SERDES_0_PROPERTIES_URL: http://schema-registry:8081
      depends_on:
        - kafka
        - schema-registry
      networks:
        - tablewatch-network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: tablewatch-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tablewatch
      POSTGRES_USER: tablewatch
      POSTGRES_PASSWORD: tablewatch
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # pg_cron setup
    networks:
      - tablewatch-network
    command: postgres -c shared_preload_libraries=pg_cron

  flink-jobmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: tablewatch-flink-jobmanager
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager
    networks:
      - tablewatch-network

  flink-taskmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: tablewatch-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    networks:
      - tablewatch-network

  flink-jobs:
    build: .
    container_name: tablewatch-flink-jobs
    depends_on:
      - flink-jobmanager
      - flink-taskmanager
      - kafka
      - timescaledb
    env_file:
      - .env
    networks:
      - tablewatch-network
    command: >
      bash -c "
        echo 'Waiting for Flink cluster...' &&
        sleep 15 &&
        echo 'Submitting Flink jobs...' &&
        python -m src.pipelines.anomaly.bet_spread &
        python -m src.pipelines.anomaly.win_rate &
        python -m src.pipelines.anomaly.bet_rate_of_change &
        python -m src.pipelines.anomaly.wonging &
        python -m src.pipelines.anomaly.team_correlation_prefilter &
        echo 'All Flink jobs submitted' &&
        wait
      "
    restart: unless-stopped

volumes:
  kafka_kraft:
  timescale_data:

networks:
  tablewatch-network:
    driver: bridge